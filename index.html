<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scott Bronder — Coming soon</title>
    <meta name="description" content="scottbronder.com is coming soon." />
    <meta property="og:title" content="Scott Bronder — Coming soon" />
    <meta property="og:description" content="scottbronder.com is coming soon." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scottbronder.com/" />
    <meta name="theme-color" content="#0b0d10" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Ctext x='32' y='42' font-family='system-ui,sans-serif' font-size='28' font-weight='600' fill='%23e8eaed' text-anchor='middle'%3ESB%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      html {
        height: 100%;
      }

      body {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(60rem 30rem at 50% -10rem, rgba(96, 165, 250, 0.14), transparent 60%),
          var(--bg);
        color: #e8eaed;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        text-align: center;
      }

      main {
        display: grid;
        gap: 1rem;
        animation: rise 0.9s ease-out both;
      }

      h1 {
        font-size: clamp(2.25rem, 7vw, 4rem);
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      p {
        color: #9aa3ad;
        font-size: clamp(1rem, 2.5vw, 1.25rem);
      }

      a {
        color: #8ab4f8;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(0.75rem);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Scott Bronder</h1>
      <p>Coming soon.</p>
      <p><a href="mailto:hello@scottbronder.com">hello@scottbronder.com</a></p>
    </main>
  </body>
</html>
